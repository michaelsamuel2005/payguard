name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: payguard
          POSTGRES_USER: payguard
          POSTGRES_PASSWORD: payguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payguard -d payguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PAYGUARD_TEST_DB_URL: jdbc:postgresql://localhost:5432/payguard
      PAYGUARD_TEST_DB_USER: payguard
      PAYGUARD_TEST_DB_PASSWORD: payguard
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/payguard
      SPRING_DATASOURCE_USERNAME: payguard
      SPRING_DATASOURCE_PASSWORD: payguard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        shell: bash
        run: mvn -B -ntp verify 2>&1 | tee build.log
      - name: Explain failures
        if: failure()
        run: python3 .github/scripts/report.py --annotate build.log target/surefire-reports
      - name: Test summary
        if: always()
        run: python3 .github/scripts/report.py --summary build.log target/surefire-reports >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build.log
            target/surefire-reports
          if-no-files-found: ignore

  image:
    name: Docker image, smoke test and browser tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Create dev keys
        run: java scripts/DevToken.java > /dev/null
      - name: Build the image and start payguard with PostgreSQL
        run: docker compose up -d --build
      - name: Wait for payguard
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "::error title=startup::payguard did not become healthy"; exit 1
      - name: Smoke test (also warms the JVM up, so the name check's 800 ms limit is not hit cold)
        run: bash scripts/smoke.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json
      - name: Install the browser-test tools
        working-directory: ui-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Page unit and contract tests
        working-directory: ui-tests
        run: npm run test:unit
      - name: Browser tests (journeys, accessibility, keyboard, reflow, security headers)
        working-directory: ui-tests
        env:
          CI: 'true'
          PAYGUARD_URL: http://localhost:8080
          PAYGUARD_E2E: real
        run: npx playwright test
      - name: Browser test summary
        if: always()
        run: python3 .github/scripts/ui_report.py --summary ui-tests/ui-report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Browser test annotations
        if: failure()
        run: python3 .github/scripts/ui_report.py --annotate ui-tests/ui-report.json
      - name: Upload browser-test report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            ui-tests/playwright-report
            ui-tests/test-results
            ui-tests/ui-report.json
          if-no-files-found: ignore
      - name: Application log on failure
        if: failure()
        run: docker compose logs --no-color app | tail -n 150
      - name: Stop
        if: always()
        run: docker compose down -v

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary deploy/k8s deploy/k8s/examples

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
      - uses: github/codeql-action/analyze@v4
