# An example only, kept out of deploy/k8s so `kubectl apply -f deploy/k8s` never applies it.
# Create the real secret from the organisation's secret store.
apiVersion: v1
kind: Secret
metadata:
  name: payguard-db
type: Opaque
stringData:
  PAYGUARD_DB_URL: jdbc:postgresql://payguard-db:5432/payguard
  PAYGUARD_DB_USER: payguard
  PAYGUARD_DB_PASSWORD: change-me
